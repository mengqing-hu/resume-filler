<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>简历填写助手设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="options-shell">
      <div id="workspace" class="workspace">
        <aside id="resume-sidebar" class="resume-sidebar" aria-labelledby="resume-list-title">
          <div class="sidebar-heading">
            <div id="sidebar-title" class="sidebar-title">
              <h2 id="resume-list-title">简历版本</h2>
              <span id="resume-count">0 份</span>
            </div>
            <button
              id="toggle-resume-sidebar"
              class="sidebar-toggle"
              type="button"
              aria-controls="resume-sidebar-content"
              aria-expanded="true"
              aria-label="收起简历版本栏"
            >
              ▼
            </button>
          </div>
          <div id="resume-sidebar-content">
            <div id="resume-list" class="resume-list" aria-live="polite"></div>
            <button id="create-resume" class="create-resume-button" type="button">
              新建空白简历
            </button>
            <div class="backup-actions">
              <button id="import-backup" type="button">导入备份</button>
              <button id="export-all" type="button">导出全部</button>
            </div>
            <input id="backup-file" type="file" accept="application/json,.json" hidden>
          </div>
        </aside>

        <section class="editor-panel" aria-labelledby="resume-title">
          <header class="editor-header">
            <div>
              <p class="section-label">正在编辑</p>
              <h2 id="resume-title">正在加载</h2>
              <p id="save-status" class="save-status" role="status" aria-live="polite">
                正在读取本地数据
              </p>
            </div>
            <button id="save-resume" class="primary-button" type="button" disabled>
              立即保存
            </button>
          </header>

          <div class="editor-tabs" role="tablist" aria-label="简历设置区域">
            <button class="editor-tab editor-tab--active" type="button" role="tab" aria-selected="true" data-tab="content">
              简历内容
            </button>
            <button class="editor-tab" type="button" role="tab" aria-selected="false" data-tab="modules">
              模块管理
            </button>
            <button class="editor-tab" type="button" role="tab" aria-selected="false" data-tab="fields">
              字段管理
            </button>
          </div>

          <section id="content-panel" class="tab-panel" data-panel="content">
            <nav id="module-navigation" class="module-navigation" aria-label="简历模块"></nav>
            <form id="resume-form" class="resume-form">
              <p class="loading-state">正在准备简历...</p>
            </form>
          </section>

          <section id="module-manager" class="tab-panel management-panel" data-panel="modules" hidden></section>
          <section id="field-manager" class="tab-panel management-panel" data-panel="fields" hidden></section>
        </section>
      </div>

      <p id="page-error" class="page-error" role="alert" hidden></p>
    </main>

    <div id="action-toast" class="action-toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="options.js"></script>
  </body>
</html>
