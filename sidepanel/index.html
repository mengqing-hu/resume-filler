<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>简历填写助手</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="panel-shell">
      <header class="panel-header">
        <div>
          <p class="eyebrow">Resume Filler</p>
          <h1>简历填写助手</h1>
        </div>
        <button id="open-options" class="settings-button" type="button" aria-label="打开设置页">
          设置
        </button>
      </header>

      <section class="resume-summary" aria-labelledby="active-resume-label">
        <label id="active-resume-label" for="resume-selector">当前简历</label>
        <select id="resume-selector" aria-label="切换当前简历" disabled>
          <option>正在加载</option>
        </select>
      </section>

      <p class="milestone-note">
        先点击网页输入框，再点击下方字段填写；没有选中输入框时会复制内容。
      </p>

      <div id="module-list" class="module-list" aria-live="polite">
        <p class="loading-state">正在读取简历内容...</p>
      </div>

      <p id="panel-status" class="panel-status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
